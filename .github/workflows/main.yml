name: Packaging Script checker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Syntax & Best Practice Validator
  lint-scripts:
    name: Validate Code Quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSUseWriteHostForOutput
          if ($results) { $results | Format-Table; exit 1 }

  # Job 2: Naming Convention Enforcement
  naming-check:
    name: Validate Naming Standards
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Naming Convention Script
        shell: pwsh
        run: |
          # Add your logic here to check the folder names
          # Example: Verify _x64_P1 suffix for 64-bit folders
          $folders = Get-ChildItem -Path . -Directory
          foreach ($folder in $folders) {
              if ($folder.Name -match "64bit" -and $folder.Name -notmatch "_x64_P1$") {
                  Write-Error "Naming violation: 64-bit folder '$($folder.Name)' is missing _x64_P1 suffix."
                  exit 1
              }
          }
